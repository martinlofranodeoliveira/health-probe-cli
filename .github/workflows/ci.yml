name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, Vet, Test, and Offline Demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Run go vet
        run: go vet ./...

      - name: Run test suite with race detector
        run: go test -v -race ./...

      - name: Run deterministic offline demo
        run: go run ./cmd/health-probe demo
